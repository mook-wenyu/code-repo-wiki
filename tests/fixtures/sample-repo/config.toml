
[scope]
include = ["**/*.rs"]
exclude = []

[output]
dir = "wiki"
format = "markdown"

[llm]
provider = "mock"
model = "gpt-4o"
api_key = "mock"
api_key_env = "OPENAI_API_KEY"
max_concurrent = 1

[incremental]
enabled = false
strategy = "git-diff"

[search]
enabled = true
index_dir = ".search"
default_engine = "text"
default_top_k = 10
