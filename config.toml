# code-repo-wiki 默认配置模板（由 `code-repo-wiki install` 或缺省配置链写入用户级目录；
# v25 起项目级配置为 config.toml（字段级合并覆盖用户级）
# 键集合与 src/config/schema.rs 严格对齐；未知键会被 serde 忽略（无效配置，勿写）。
# v30 傻瓜式精简：输出目录/扫描范围/增量策略/搜索与嵌入开关/计划文件等全部
# 硬编码（见 schema.rs 顶部常量），模板只保留用户真正需要决策的三类键。

[wiki]
language = "zh"

# 生成引导/自定义文档/扫描范围现由项目根 wiki_plan.yaml 控制（v0.9 起替代旧
# [wiki.guide] 段；文件不存在 = 默认行为，见 docs/reference/config.md）。见 src/config/plan.rs。

[llm]
provider = "openai-compatible"
model = "deepseek-v4-flash"
# base_url 与模型配套（模板默认阵营=v29 实测可用组合）：provider=
# openai-compatible（chat/completions，DeepSeek 网关文档化路由，见
# schema.rs LlmProviderType 注释）缺省端点=DeepSeek 网关；显式声明便于
# 换用 OpenAI/其他服务时改此处
base_url = "https://opencode.ai/zen/go/v1"
#api_key = ""
api_key_env = "OPENCODEGO2_API_KEY"
# v50 thinking 开关（bench 基线重录前关闭提速）：false = 关闭思考。
# 两条 openai 协议的 thinking 写法不同（I1 双路径对齐，见 llm.rs）：
#   openai-compatible（chat/completions）→ `thinking: {"type":"disabled"}`
#     + 可选 `reasoning_effort: "low|high|max"`
#   openai（Responses）→ `reasoning: {"effort":"none"}`（关）/
#     `reasoning: {"effort":"low|high|max"}`（开）
# 模板默认 openai-compatible，故 thinking=false 实际发出
# `thinking: {"type":"disabled"}`。
thinking = false
# 并发 LLM 调用上限可配：max_concurrency（缺省 16；超出上限的调用排队等待，
# 防触发服务端动态限流——P2-8）；温度等其余参数已硬编码（v22 简化）

[embed]
# 语义搜索与实体级特征聚类的向量来源（开关已硬编码恒启用；无 Key 环境
# 自动降级为纯结构聚类，见 lib.rs attach_features/build_search_index）
# 模型/端点/批次上限与官方文档逐项对齐（2026-07-15 上线的多语言文本
# 统一向量模型，支持 256~2560 维，官方文档：
#   https://help.aliyun.com/zh/model-studio/qwen3-7-text-embedding）：
# - model 用官方模型 ID；base_url 用官方推荐的业务空间专属域名
#   {WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
# - 官方限流表（华北2北京）：RPM=24000/分钟、TPM=1,000,000/分钟
model = "qwen3.7-text-embedding"
base_url = "https://llm-q0265e4he9m0qs23.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
#api_key = ""
api_key_env = "BAILIAN_API_KEY"
# 批量嵌入并发可配（两层）：
#   embed.max_concurrency  缺省 4——整批并发上限（同时运行的 embed_batch 数）
#   embed.batch_concurrency 缺省 1——单批内并发 HTTP 请求数。百炼
#     qwen3.7-text-embedding TPM=1,000,000/分钟，批内并发过高触发 429
#     吞吐限流（官方错误码 429-Throttling.AllocationQuota/insufficient_quota
#     = TPS/TPM 吞吐限流，非资金配额；见
#     https://help.aliyun.com/zh/model-studio/error-code）；显式 1 保守串行，
#     需提速再手动调大（超限由 429 重试退避兜底）。
batch_concurrency = 1
# batch_size 已硬编码 =20（=官方批次上限 20 行/请求，见 schema.rs EMBED_BATCH_SIZE）
# provider = "remote"   # remote=远程 API（默认）| mock=测试 mock server；本地 ONNX 路径已删除（v0.7.2）
