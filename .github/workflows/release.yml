name: Release

# 发布工作流（tag v* 触发）：
#   1. create-release   —— 创建 Draft GitHub Release（--generate-notes）
#   2. publish-crates-io —— crates.io 发布（Trusted Publishing，OIDC 免长期 token）
#   3. build-binaries   —— 矩阵构建并上传二进制到 Draft（ref 指定上传目标，
#                          消除并发创建竞态——矩阵各 job 各自创建 Release 会
#                          反复 "release not found"）
#   4. test             —— 三平台测试前置（发布前全绿）
#   5. publish-release  —— 全部二进制上传完成后 Draft → 正式发布
#
# 注意（首次发布）：
#   - 新 crate 不能走 Trusted Publishing，首次必须手动 `cargo publish`
#     （crates.io 账号验证邮箱 + cargo login 后手动执行一次）；
#   - 之后 tag vX.Y.Z 推送即自动触发本工作流。
#   - 仓库 Actions 写权限需为 Read and write（Settings → Actions → General →
#     Workflow permissions），否则 GITHUB_TOKEN 无法创建/编辑 Release。

on:
  push:
    tags:
      - "v*"

# 最小权限：顶层只读；写 Release 的 job 单独提升 contents: write，
# 仅 publish-crates-io 提升 id-token（Trusted Publishing 向 crates.io 换短期 token）
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Draft GitHub Release
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Draft Release 先行创建：build-binaries 矩阵各 job 通过 ref（tag）
      # 上传到同一个 Draft；全部上传完成后由 publish-release 转为正式。
      # 注：gh release create 不支持 --json；且把命令放进 echo "$(...)" 会吞掉
      # 失败退出码（bash -e 只看整条 echo 的退出码）——release_id 会静默为空，
      # 下游 taiki-e/gh release edit 按 tag 查 Draft 一律 404。
      # 改用 gh api POST（--jq .id 取 id），赋值独立一行让失败正确传播。
      - name: Create draft release
        id: create
        run: |
          # 引号包裹 URL：{owner}/{repo} 是 gh api 的仓库占位符，
          # 裸花括号会触发 shellcheck SC1083（actionlint 门禁）
          RELEASE_ID="$(gh api --method POST "repos/{owner}/{repo}/releases" \
            -f tag_name="${{ github.ref_name }}" \
            -F draft=true \
            -F generate_release_notes=true \
            --jq .id)"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  # v13.9 发布测试前置：tag 推送不触发 ci.yml（其 on 仅 master 分支+PR），
  # 发布产物（crates.io 包 + 三平台二进制）必须在测试全绿后才允许发布——
  # 测试矩阵与 ci.yml 同构（三平台 + macOS OpenSSL 步骤）
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Windows 系统代理会劫持 localhost 请求（reqwest 测试用本地 mock server）
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 分支（2026-08-05 锁定）
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (2.9.2)
      - name: Install system deps (git2/openssl)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Install OpenSSL (macos)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --locked --no-fail-fast

  # Cargo Book 推荐：正式发布前 dry-run 验证可打包性（只打包不真正上传）
  publish-dry-run:
    needs: [create-release, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 分支（2026-08-05 锁定）
      - name: Install system deps (git2/openssl)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Publish dry-run
        run: cargo publish --dry-run --locked

  publish-crates-io:
    needs: [create-release, test, publish-dry-run]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing：向 crates.io 换取短期发布 token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 分支（2026-08-05 锁定）
      - name: Install system deps (git2/openssl)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      # OIDC 交换 30 分钟短期 token（需 crates.io 侧启用 Trusted Publishing：
      # https://crates.io/settings/trusted-publishing → Add owner）
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1 (v1.0.5)
        id: auth
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  build-binaries:
    needs: [create-release, test]
    permissions:
      contents: write # 上传二进制 asset 到 Draft Release
    strategy:
      fail-fast: false
      matrix:
        # 注：macos 仅发 aarch64（arm64）——GitHub macos-latest 已全 arm64；
        # x86_64-apple-darwin 交叉编译需 x86_64 版 openssl（brew openssl@3 仅
        # arm64——taiki-e 实测 openssl-sys 找不到安装目录）。Intel Mac 用户
        # 走 crates.io 源码路径：cargo install code-repo-wiki --locked
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 分支（2026-08-05 锁定）
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (2.9.2)
      - name: Install system deps (git2/openssl)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      # macos 自带 LibreSSL 与 openssl-sys 构建不兼容——
      # 安装 Homebrew openssl@3 并以 PKG_CONFIG_PATH 暴露（keg-only 不自动链接）
      - name: Install OpenSSL (macos)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
      # 上传到 create-release 的 Draft（ref 指定 tag；该 action 无 release-id 输入，
      # 旧配置被静默忽略、上传靠 tag 查找碰巧工作——已按有效输入显式化）
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1 (1.30.2)
        with:
          bin: code-repo-wiki
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          ref: refs/tags/${{ github.ref_name }}

  publish-release:
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write # 将 Draft Release 转为正式
    steps:
      # 4 个目标二进制全部上传完成后，Draft → 正式发布。
      # 按 id PATCH（gh release edit 按 tag 查 Draft 会 404——draft 不公开）
      - name: Publish release
        # 用 ${{ github.repository }} 显式展开——gh api 的 {owner}/{repo} 占位符
        # 依赖 git remote 解析，本 job 无 checkout 步骤会报 unable to expand placeholder
        run: gh api --method PATCH "repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}" -F draft=false
        env:
          GH_TOKEN: ${{ github.token }}
