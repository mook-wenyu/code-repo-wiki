name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  # 静态门禁：clippy -D warnings + rustdoc -Dwarnings（Microsoft RustTraining 三段式 check 阶段）
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (git2/openssl)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Clippy (all targets, warnings as errors)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Docs (warnings as errors)
        run: RUSTDOCFLAGS='-Dwarnings' cargo doc --no-deps --locked

  # 测试矩阵：跨平台声明（Windows 本地开发 + Unix 路径差异回归）
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (git2/openssl)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Test
        run: cargo test --locked

  # workflow 本身校验（actionlint 惯例——语法/语义/注入检查）
  lint-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
