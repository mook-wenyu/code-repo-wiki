name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

# 最小权限：顶层默认只读；需要写权限的 job 单独提升（GitHub 官方安全基线）
permissions:
  contents: read

jobs:
  # 静态门禁：clippy -D warnings + rustdoc -Dwarnings（Microsoft RustTraining 三段式 check 阶段）
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 分支（2026-08-05 锁定）
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (2.9.2)
      - name: Install system deps (git2/openssl)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Format check (rustfmt)
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, warnings as errors)
        run: cargo clippy --all-targets --locked --no-deps -- -D warnings
      - name: Docs (warnings as errors)
        run: RUSTDOCFLAGS='-Dwarnings' cargo doc --no-deps --locked

  # 测试矩阵：跨平台声明（Windows 本地开发 + Unix 路径差异回归）
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Windows 系统代理会劫持 localhost 请求（reqwest 测试用本地 mock server）
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 分支（2026-08-05 锁定）
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (2.9.2)
      - name: Install system deps (git2/openssl)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Install OpenSSL (macos)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --locked --no-fail-fast
      # P2-3 覆盖：local-embed 特性编译门禁（仅 ubuntu，避免三平台重复编译大依赖树）
      - name: Check local-embed feature
        if: runner.os == 'Linux'
        run: cargo check --locked --features local-embed

  # workflow 本身校验（actionlint 惯例——语法/语义/注入检查）
  lint-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2 (2.2.0)

  # 文档质量门禁：markdownlint（结构/风格）+ lychee（链接可达性）
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: markdownlint (markdownlint-cli2)
        run: npx --yes markdownlint-cli2 "*.md" "docs/**/*.md" "!CHANGELOG.md" "!STATUS.md"
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2 (2.9.0)
        with:
          args: --cache --max-cache-age 1d --verbose --no-progress "*.md" "docs/**/*.md"
          fail: true
