[package]
name = "repo-wiki"
version = "0.2.0"
edition = "2024"
description = "自动分析代码仓库结构，通过 LLM 生成结构化项目文档"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-java = "0.23"
notify = "7"
notify-debouncer-full = "0.4"
petgraph = { version = "0.8", features = ["serde-1"] }
leiden-rs = { version = "0.8", default-features = false, features = ["petgraph", "rayon"] }
git2 = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "process", "signal"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
pulldown-cmark = "0.12"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
glob = "0.3"
ignore = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
serde_yaml = "0.9"
rmcp = { version = "3.1.0", features = ["server", "transport-io"] }
sqlite-vec = "0.1.9"
# Mermaid 语法校验（G2 校验-重试-降级循环的权威解析器）：
# 纯 Rust、无浏览器依赖，对齐 mermaid@11.15.0 语法基线；
# 错误消息人类可读（t03 POC 实测 "Unterminated node label" 等），可直接作为 LLM 重试反馈
merman-core = "0.7"

# 基准目标：harness = true 使其以普通 #[test] 形式运行（cargo test --bench bench_search），
# 而非需要 nightly 的 #[bench]；benches/ 目录默认不被 cargo test 编译，必须显式声明
[[bench]]
name = "bench_search"
harness = true
