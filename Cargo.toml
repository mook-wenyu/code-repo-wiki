[package]
name = "code-repo-wiki"
version = "0.7.0"
edition = "2024"
description = "自动分析代码仓库结构，通过 LLM 生成结构化项目文档（Code Repo Wiki）"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/mook-wenyu/code-repo-wiki"
keywords = ["documentation", "wiki", "llm", "code-analysis", "knowledge-graph"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.38", features = ["bundled", "load_extension", "fallible_uint"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25.0"
tree-sitter-c-sharp = "0.23"
tree-sitter-java = "0.23"
notify = "7"
notify-debouncer-full = "0.4"
petgraph = { version = "0.8", features = ["serde-1"] }
leiden-rs = { version = "0.8", default-features = false, features = ["petgraph", "rayon"] }
git2 = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "process", "signal"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
pulldown-cmark = "0.12"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
glob = "0.3"
ignore = "0.4"
fd-lock = "4"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rmcp = { version = "3.1.0", features = ["server", "transport-io"] }
sqlite-vec = "0.1.9"
# 本地嵌入（T04a）：fastembed 纯 ONNX 推理免 API key；default-features=false 避免拉入
# candle/图像栈，ort-download-binaries-native-tls 为最小推理集（bge 量化版无需 qwen3 feature）；
# hf-hub-native-tls 提供模型下载（try_new 受 #[cfg(feature="hf-hub")] 门控，缺之编译报 E0599）
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"], optional = true }
# Mermaid 语法校验（G2 校验-重试-降级循环的权威解析器）：
# 纯 Rust、无浏览器依赖，对齐 mermaid@11.15.0 语法基线；
# 错误消息人类可读（t03 POC 实测 "Unterminated node label" 等），可直接作为 LLM 重试反馈
merman-core = "0.7"

[features]
# T04-C：本地嵌入为可选特性——纯远程用户不编译 ort/tokenizers 大依赖树
# （默认构建零增量；cargo build --features local-embed 启用）
local-embed = ["dep:fastembed"]

# 基准目标：harness = true 使其以普通 #[test] 形式运行（cargo test --bench bench_search），
# 而非需要 nightly 的 #[bench]；benches/ 目录默认不被 cargo test 编译，必须显式声明
[[bench]]
name = "bench_search"
harness = true
